[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mjlab-hv1v1"
version = "0.1.0"
description = "HV1V1 humanoid robot and velocity-tracking tasks for mjlab"
requires-python = ">=3.10,<3.14"
# Pinned: the entity/actuator config shapes used here are 1.6.0-specific
# (EntityArticulationInfoCfg has exactly two fields, BuiltinPositionActuatorCfg
# has no velocity_limit, tasks register through mjlab.tasks.registry).
dependencies = ["mjlab==1.6.0"]

# This is what makes the package a real mjlab plugin: mjlab's
# _import_registered_packages() walks this entry-point group on `import mjlab`
# and imports each target, which is when our register_mjlab_task calls fire.
# Nothing needs to be vendored into the mjlab checkout.
[project.entry-points."mjlab.tasks"]
mjlab_hv1v1 = "mjlab_hv1v1"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mjlab_hv1v1 = ["assets/hv1v1/*.xml", "assets/hv1v1/meshes/*.STL"]
