# HV1V1 policy service config -- GENERATED by export_mnn.py, do not hand-edit.
# Every value is derived from deploy.json, which is written from the trained
# model. Editing here silently desynchronises the robot from the policy.

robot: hv1v1
run: "2026-09-30_14-47-56_v5"
iterations: 39999
exported_utc: "2026-10-01T04:42:55+00:00"

model:
  file: "walk_hv1v1_v5.mnn"
  format: mnn
  input_name: "obs"
  output_name: "actions"
  obs_dim: 498
  action_dim: 31

control:
  rate_hz: 50            # policy / target update rate
  control_dt: 0.02
  pd_rate_hz_min: 200       # the joint PD must run AT LEAST this fast; see README
  root_body: "pelvis"

# Term-major, oldest frame first. Assemble in exactly this order.
# At t=0 BACKFILL every history slot with the first reading; never zero-fill.
observation:
  - name: base_ang_vel
    dim: 3
    history: 5
  - name: projected_gravity
    dim: 3
    history: 5
  - name: joint_pos
    dim: 31
    history: 5
  - name: joint_vel
    dim: 31
    history: 5
  - name: actions
    dim: 31
    history: 5
  - name: command
    dim: 3
    history: 1

